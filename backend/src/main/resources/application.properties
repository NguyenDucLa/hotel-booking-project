spring.application.name=backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/db_hotel?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
hotel.jwt.secret=PhaiCoMotCaiChiaKhoaThatDaiVaBaoMatOToanBoHeThongNay1234567890abcdefghiklmnOPQRSTUVXYZ
hotel.jwt.expiration=86400000

# PayOS Configuration
payos.client-id=your-client-id
payos.api-key=your-api-key
payos.checksum-key=your-checksum-key
